name: Deploy Next.js to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL_LOCAL: ${{ secrets.NEXT_PUBLIC_API_URL_LOCAL }}
      NEXT_PUBLIC_API_URL_LIVE: ${{ secrets.NEXT_PUBLIC_API_URL_LIVE }}
      NEXT_PUBLIC_API_ENV: ${{ secrets.NEXT_PUBLIC_API_ENV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Verify output
        run: |
          test -d out || { echo "out/ not found"; exit 1; }
          ls -la out

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
